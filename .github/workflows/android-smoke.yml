name: Android tablet smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/viewer_flutter/**'
      - 'src/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/viewer_flutter
        run: flutter pub get

      - name: Run gesture smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          force-avd-creation: true
          disable-animations: true
          script: >-
            flutter test
            integration_test/tablet_stability_workflow_test.dart
            -d emulator-5554
