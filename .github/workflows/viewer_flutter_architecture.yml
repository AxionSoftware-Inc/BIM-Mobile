name: Viewer Flutter Architecture

on:
  push:
    branches:
      - refactor/architecture-cleanup-0.3.2
    paths:
      - 'apps/viewer_flutter/**'
      - '.github/workflows/viewer_flutter_architecture.yml'
  pull_request:
    paths:
      - 'apps/viewer_flutter/**'
      - '.github/workflows/viewer_flutter_architecture.yml'

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Architecture guards
        run: flutter test test/architecture
