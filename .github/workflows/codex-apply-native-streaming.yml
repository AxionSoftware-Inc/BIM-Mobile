name: Codex native streaming patch

on:
  push:
    branches:
      - codex/data-oriented-spatial-streaming-2026-09-08
    paths:
      - .github/workflows/codex-apply-native-streaming.yml
      - .github/scripts/codex_fix_native_streaming.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/data-oriented-spatial-streaming-2026-09-08
          fetch-depth: 0

      - name: Apply guarded host patch
        run: python3 .github/scripts/codex_fix_native_streaming.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q "NATIVE_STREAMING_WORKING_SET_V2" apps/viewer_flutter/android/app/src/main/kotlin/com/example/viewer_flutter/RenderSceneFilamentHostView.kt
          git diff --check
          git diff --stat

      - name: Commit patched host
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No host changes required."
            exit 0
          fi
          git config user.name "AxionSoftware-Inc"
          git config user.email "137527004+AxionSoftware-Inc@users.noreply.github.com"
          git add apps/viewer_flutter/android/app/src/main/kotlin/com/example/viewer_flutter/RenderSceneFilamentHostView.kt
          git commit -m "Implement bounded native BIM working set"
          git push origin HEAD:codex/data-oriented-spatial-streaming-2026-09-08
