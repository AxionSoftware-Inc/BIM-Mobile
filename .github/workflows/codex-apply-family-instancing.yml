name: Codex family instancing host patch

on:
  push:
    branches:
      - codex/data-oriented-spatial-streaming-2026-09-08
    paths:
      - .github/workflows/codex-apply-family-instancing.yml
      - .github/scripts/codex_apply_family_instancing.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/data-oriented-spatial-streaming-2026-09-08
          fetch-depth: 0

      - name: Apply guarded family-instancing patch
        run: python3 .github/scripts/codex_apply_family_instancing.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          HOST=apps/viewer_flutter/android/app/src/main/kotlin/com/example/viewer_flutter/RenderSceneFilamentHostView.kt
          grep -q "NativeFamilyInstancingPolicy.isCandidate(" "$HOST"
          if grep -A3 "private fun isInstanceCandidate" "$HOST" | grep -q 'setOf("door", "window", "column")'; then
            echo "Legacy family admission hardcode is still present" >&2
            exit 1
          fi
          git diff --check
          git diff --stat

      - name: Commit patched host
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No host changes required."
            exit 0
          fi
          git config user.name "AxionSoftware-Inc"
          git config user.email "137527004+AxionSoftware-Inc@users.noreply.github.com"
          git add apps/viewer_flutter/android/app/src/main/kotlin/com/example/viewer_flutter/RenderSceneFilamentHostView.kt
          git commit -m "Wire native family instancing policy"
          git push origin HEAD:codex/data-oriented-spatial-streaming-2026-09-08
