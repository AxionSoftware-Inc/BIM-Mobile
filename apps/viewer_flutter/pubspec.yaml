name: viewer_flutter
description: Production tablet BIM authoring client for TabletBimEngine.
publish_to: "none"
version: 0.3.0+28

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10+1
  pdf: ^3.13.0
  printing: ^5.15.0
  sentry_flutter: ^9.27.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sample_project.json
    - assets/render_scene.json
    - assets/families/
